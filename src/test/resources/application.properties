# Test-only configuration: keep the contextLoads test hermetic (no MySQL needed).
# Overrides the default 'local' profile (which points at MySQL) so the Spring
# context boots against an in-memory H2 database instead.
spring.profiles.active=
spring.datasource.url=jdbc:h2:mem:dojomgr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
hibernate.dialect=org.hibernate.dialect.H2Dialect
