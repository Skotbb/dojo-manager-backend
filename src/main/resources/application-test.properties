# Hermetic test profile: boot the context against in-memory H2 (MySQL emulation
# via MODE=MySQL) so no external MySQL server is required. Overrides the default
# 'local' profile, which points at MySQL.
spring.datasource.url=jdbc:h2:mem:dojomgr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT properties required by JwtProvider (@Value("${security.app.jwtSecret}") and
# "${security.app.jwtExpiration}"). The main application.properties normally
# supplies these, but the test classpath's application.properties shadows the
# main one and does not define them, so the test profile must.
security.app.jwtSecret=dirtySecret
security.app.jwtExpiration=43200
